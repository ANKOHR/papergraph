[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "papergraph"
version = "0.1.0"
description = "A deterministic graph builder for synthetic structured research papers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
pgr = "pgr.cli:main"

[tool.setuptools.packages.find]
include = ["pgr*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
